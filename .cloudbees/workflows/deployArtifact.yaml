

apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: Deploy Artifact
on:
  workflow_call:
    inputs:
      artifact-id:
        type: string
        required: true
      environment:
        type: string
        required: true
jobs:
  deploy:
    environment: ${{ inputs.environment }}
    steps:
      - name: invoke-jenkins-job
        uses: cloudbees-io/jenkins-run-job@v2
        with:
          url: ${{ vars.CJOC_URL }}
          username: ${{ vars.CJOC_USERNAME }}
          token: ${{ secrets.CJOC_Password }}
          job-name: Aruna Testing/sample_deploy
      - name: Inform system that an artifact version was deployed
        kind: deploy
        uses: cloudbees-io/register-deployed-artifact@v2
        with:
          artifact-id: "${{ inputs.artifact-id }}"
